<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cart Saver</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="cmcs-root">
    <main class="page">
      <header class="top">
        <span id="logo"></span>
        <div>
          <h1 class="cmcs-wordmark">CART SAVER</h1>
          <p class="cmcs-muted" data-i18n="extDescription"></p>
        </div>
      </header>

      <section class="card">
        <h2 data-i18n="settingsTitle"></h2>
        <div class="row row--input row--static row--language">
          <span>
            <strong id="languageTitle" data-i18n="settingLanguage"></strong>
            <span class="cmcs-muted" data-i18n="settingLanguageHelp"></span>
          </span>
          <div id="language" class="cmcs-seg cmcs-seg--large" role="group" aria-labelledby="languageTitle">
            <button type="button" data-lang="auto" data-i18n="languageAuto"></button>
            <button type="button" data-lang="nl" lang="nl">Nederlands</button>
            <button type="button" data-lang="en" lang="en">English</button>
          </div>
        </div>
        <label class="row">
          <input type="checkbox" id="autoTrack" />
          <span>
            <strong data-i18n="settingAutoTrack"></strong>
            <span class="cmcs-muted" data-i18n="settingAutoTrackHelp"></span>
          </span>
        </label>
        <label class="row">
          <input type="checkbox" id="showReminder" />
          <span>
            <strong data-i18n="settingReminder"></strong>
            <span class="cmcs-muted" data-i18n="settingReminderHelp"></span>
          </span>
        </label>
        <label class="row">
          <input type="checkbox" id="notify" />
          <span>
            <strong data-i18n="settingNotify"></strong>
            <span class="cmcs-muted" data-i18n="settingNotifyHelp"></span>
          </span>
        </label>
        <label class="row">
          <input type="checkbox" id="awayChecks" />
          <span>
            <strong data-i18n="settingAway"></strong>
            <span class="cmcs-muted" data-i18n="settingAwayHelp"></span>
          </span>
        </label>
        <div class="row row--block">
          <label class="row-check">
            <input type="checkbox" id="priceTrend" />
            <span>
              <strong data-i18n="settingTrend"></strong>
              <span class="cmcs-muted" data-i18n="settingTrendHelp"></span>
            </span>
          </label>
          <span class="cmcs-muted psa-note" id="trendStatus" aria-live="polite"></span>
          <button type="button" class="cmcs-btn cmcs-btn--small cmcs-btn--ghost grant" id="trendGrant" data-i18n="permissionGrant" hidden></button>
        </div>
        <div class="row row--block">
          <label class="row-check">
            <input type="checkbox" id="psaEstimate" />
            <span>
              <strong data-i18n="settingPsa"></strong>
              <span class="cmcs-muted" data-i18n="settingPsaHelp"></span>
            </span>
          </label>
          <div class="psa-key" id="psaKeyBox">
            <input type="password" id="pptApiKey" autocomplete="off" spellcheck="false" data-i18n-placeholder="settingPsaKeyPlaceholder" data-i18n-label="settingPsaKeyPlaceholder" />
            <button type="button" class="cmcs-btn cmcs-btn--small cmcs-btn--ghost" id="psaRefresh" data-i18n="settingPsaRefresh"></button>
          </div>
          <span class="cmcs-muted psa-note">
            <span data-i18n="settingPsaKeyHelp"></span>
            <a href="https://www.pokemonpricetracker.com/free-pokemon-card-price-api" target="_blank" rel="noopener" data-i18n="settingPsaGetKey"></a>
          </span>
          <span class="cmcs-muted psa-note" id="psaStatus" aria-live="polite"></span>
          <button type="button" class="cmcs-btn cmcs-btn--small cmcs-btn--ghost grant" id="psaGrant" data-i18n="permissionGrant" hidden></button>
        </div>
        <label class="row row--input">
          <span>
            <strong data-i18n="settingDelay"></strong>
            <span class="cmcs-muted" data-i18n="settingDelayHelp"></span>
          </span>
          <input type="number" id="delay" min="0.5" max="10" step="0.1" />
        </label>
        <p id="saved" class="cmcs-muted saved" aria-live="polite"></p>
      </section>

      <section class="card">
        <h2 data-i18n="syncTitle"></h2>
        <div class="row row--block">
          <label class="row-check">
            <input type="checkbox" id="cloudSync" />
            <span>
              <strong data-i18n="settingSync"></strong>
              <span class="cmcs-muted" data-i18n="settingSyncHelp"></span>
            </span>
          </label>
          <div class="psa-key" id="syncBox">
            <span class="cmcs-muted sync-status" id="syncStatus" aria-live="polite"></span>
            <button type="button" class="cmcs-btn cmcs-btn--small cmcs-btn--ghost" id="syncNow" data-i18n="syncNow"></button>
          </div>
          <span class="cmcs-muted psa-note" id="syncDiag"></span>
          <p class="psa-note sync-warn" id="syncWarn" hidden></p>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="dataTitle"></h2>
        <p id="dataSummary" class="cmcs-muted"></p>
        <div class="buttons">
          <button type="button" class="cmcs-btn cmcs-btn--ghost" id="export" data-i18n="exportData"></button>
          <label class="cmcs-btn cmcs-btn--ghost">
            <span data-i18n="importData"></span>
            <input type="file" id="import" accept="application/json,.json" hidden />
          </label>
          <button type="button" class="cmcs-btn cmcs-btn--danger" id="clear" data-i18n="clearAll"></button>
        </div>
        <p id="dataMessage" class="cmcs-muted" aria-live="polite"></p>
      </section>

      <section class="card">
        <h2 data-i18n="howTitle"></h2>
        <ol class="how">
          <li data-i18n="how1"></li>
          <li data-i18n="how2"></li>
          <li data-i18n="how3"></li>
          <li data-i18n="how4"></li>
          <li data-i18n="how5"></li>
        </ol>
        <p class="cmcs-muted" data-i18n="privacyNote"></p>
      </section>
    </main>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/store.js"></script>
    <script src="../shared/ui.js"></script>
    <script src="options.js"></script>
  </body>
</html>
